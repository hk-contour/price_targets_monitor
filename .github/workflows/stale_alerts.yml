name: Stale Price Target Alerts

on:
  schedule:
    # 8:00 AM ET on weekdays (UTC-4 in summer / UTC-5 in winter)
    # Using 12:00 UTC covers ET summer (8am) — adjust to 13:00 in winter
    - cron: "0 12 * * 1-5"
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  run-stale-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stale alerts
        run: python stale_alerts.py

      - name: Commit updated state file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stale_alerts_state.json
          git diff --cached --quiet || git commit -m "chore: update stale alert state [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
