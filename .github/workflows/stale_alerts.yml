name: Stale Price Target Alerts

on:
  schedule:
    # Weekly, Friday morning ~8:00 AM ET.
    # 12:00 UTC = 8 AM ET in summer (EDT); in winter (EST) it's 7 AM ET —
    # change to "0 13 * * 5" if you want to hold 8 AM year-round.
    - cron: "0 12 * * 5"
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  run-stale-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stale alerts
        run: python stale_alerts.py

      - name: Commit updated state file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stale_alerts_state.json
          git diff --cached --quiet || git commit -m "chore: update stale alert state [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
